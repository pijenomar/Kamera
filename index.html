<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Camera</title>

<style>
body{
  margin:0;
  background:#F7F3EC;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
}
.container{
  width:100%;
  max-width:430px;
  padding:20px;
}
h1{
  font-family:Georgia,serif;
  text-align:center;
  margin-bottom:4px;
}
p{
  text-align:center;
  color:#6F655D;
}
video{
  width:100%;
  border-radius:18px;
  background:#000;
  aspect-ratio:3/4;
  object-fit:cover;
}
button{
  width:100%;
  padding:16px;
  margin-top:14px;
  font-size:18px;
  border:none;
  border-radius:999px;
  background:#3D352E;
  color:white;
  font-weight:bold;
}
#captureBtn{ display:none; }
#status{
  margin-top:16px;
  text-align:center;
  font-weight:bold;
  min-height:24px;
}
</style>
</head>

<body>

<div class="container">

<h1>Hafizan & Nabihah</h1>
<p>Help us capture our special day ♡</p>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas" hidden></canvas>

<button id="startBtn">Start Camera</button>
<button id="captureBtn">📸 Take Photo</button>

<div id="status"></div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbw3_yije37yBkn7GvgFJE8wEK9luOKedVJP8TlOTGU2x5cXQZthfEsPEdh8XwDcc6kDfA/exec";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const status = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const captureBtn = document.getElementById("captureBtn");

let stream;

// Start camera
startBtn.onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ ideal:"environment" },
        width:{ ideal:1920 },
        height:{ ideal:1080 }
      },
      audio:false
    });

    video.srcObject = stream;
    await video.play();

    startBtn.style.display = "none";
    captureBtn.style.display = "block";
    status.textContent = "";

  } catch(err){
    status.textContent = "Camera error: " + err.message;
    console.error(err);
  }
};

// Capture photo
captureBtn.onclick = async () => {

  try{

    captureBtn.disabled = true;
    status.textContent = "Uploading...";

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(video,0,0);

    const dataURL = canvas.toDataURL("image/jpeg",0.92);

    // Create base64 string
    const base64 = dataURL.split(",")[1];

    const response = await fetch(API,{
      method:"POST",
      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },
      body:JSON.stringify({
        image:base64
      })
    });

    const json = await response.json();

    if(json.success){
      status.textContent = "✓ Photo saved!";
    }else{
      status.textContent = json.error || "Upload failed";
    }

  }catch(err){

    status.textContent = "Upload failed";
    console.error(err);

  }finally{

    captureBtn.disabled = false;

  }

};
</script>

</body>
</html>
