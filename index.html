
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F3EC">
<title>Hafizan & Nabihah Wedding Camera</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#F7F3EC;
  color:#3D352E;
}

.container{
  max-width:430px;
  margin:0 auto;
  padding:24px 20px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

h1{
  font-family:Georgia,serif;
  text-align:center;
  font-size:34px;
  margin:0;
}

.subtitle{
  text-align:center;
  color:#7B6E63;
  margin:8px 0 24px;
}

video{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  background:#000;
  border-radius:22px;
}

button{
  width:100%;
  border:none;
  border-radius:999px;
  padding:16px;
  font-size:18px;
  font-weight:600;
  cursor:pointer;
}

#startBtn{
  background:#3D352E;
  color:#FFF;
  margin-top:20px;
}

#captureBtn{
  display:none;
  background:#3D352E;
  color:#FFF;
  margin-top:20px;
}

#status{
  text-align:center;
  margin-top:18px;
  min-height:24px;
  font-weight:600;
  color:#6B5B4D;
}

/* Success Screen */

#successScreen{
  display:none;
  text-align:center;
}

.tickCircle{
  width:170px;
  height:170px;
  margin:0 auto 34px;
  border-radius:50%;
  background:#D8EED4;
  display:flex;
  align-items:center;
  justify-content:center;
}

.tick{
  color:#146C43;
  font-size:92px;
  font-weight:bold;
  line-height:1;
}

.successTitle{
  font-family:Georgia,serif;
  font-size:44px;
  margin:0 0 50px;
}

#againBtn{
  background:#4A3427;
  color:white;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="container">

  <!-- Camera Screen -->
  <div id="cameraScreen">

    <h1>Majlis Persandingan Hafizan & Nabihah</h1>
    <div class="subtitle">
      ❤️ Help us capture our special day ❤️
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" hidden></canvas>

    <button id="startBtn">Start Camera</button>
    <button id="captureBtn">📸 Take Photo</button>

    <div id="status"></div>

  </div>

  <!-- Success Screen -->
  <div id="successScreen">

    <div class="tickCircle">
      <div class="tick">✓</div>
    </div>

    <div class="successTitle">
      Memory Captured
    </div>

    <button id="againBtn">
      Take Another Photo
    </button>

  </div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbw3_yije37yBkn7GvgFJE8wEK9luOKedVJP8TlOTGU2x5cXQZthfEsPEdh8XwDcc6kDfA/exec";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const status = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const captureBtn = document.getElementById("captureBtn");

const cameraScreen = document.getElementById("cameraScreen");
const successScreen = document.getElementById("successScreen");
const againBtn = document.getElementById("againBtn");

let stream;

// Start camera
startBtn.onclick = async () => {
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ ideal:"environment" },
        width:{ ideal:1920 },
        height:{ ideal:1080 }
      },
      audio:false
    });

    video.srcObject = stream;
    await video.play();

    startBtn.style.display = "none";
    captureBtn.style.display = "block";
    status.textContent = "";

  }catch(err){
    status.textContent = "Camera unavailable";
    console.error(err);
  }
};

// Capture photo
captureBtn.onclick = async () => {
  try {
    captureBtn.disabled = true;
    status.textContent = "Uploading...";

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0);

    const base64 = canvas.toDataURL("image/jpeg", 0.92).split(",")[1];

    const response = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({ image: base64 })
    });

    const json = await response.json();

    if (json.success === true) {
      cameraScreen.style.display = "none";
      successScreen.style.display = "block";
    } else {
      status.textContent = json.error || "Upload failed";
    }

  } catch (err) {
    status.textContent = "Upload failed";
    console.error(err);
  } finally {
    captureBtn.disabled = false;
  }
};

// Take another photo
againBtn.onclick = () => {
  successScreen.style.display = "none";
  cameraScreen.style.display = "block";
  status.textContent = "";
};
</script>

</body>
</html>
