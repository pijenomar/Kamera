<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Wedding Camera</title>

<style>
body{
margin:0;
background:#F7F3EC;
font-family:Arial;
display:flex;
justify-content:center;
}

.container{
width:100%;
max-width:430px;
padding:20px;
}

h1{
font-family:Georgia;
text-align:center;
margin-bottom:0;
}

p{
text-align:center;
color:#6F655D;
}

video{
width:100%;
border-radius:18px;
background:#000;
}

button{
width:100%;
padding:16px;
margin-top:14px;
font-size:18px;
border:none;
border-radius:999px;
background:#3D352E;
color:white;
font-weight:bold;
}

#status{
margin-top:15px;
text-align:center;
font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h1>Hafizan & Nabihah</h1>

<p>Help us capture our special day ♡</p>

<video id="video" autoplay playsinline muted></video>

<canvas id="canvas" hidden></canvas>

<button id="startBtn">
Start Camera
</button>

<button id="captureBtn" style="display:none">
📸 Take Photo
</button>

<div id="status"></div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbw3_yije37yBkn7GvgFJE8wEK9luOKedVJP8TlOTGU2x5cXQZthfEsPEdh8XwDcc6kDfA/exec";

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const status=document.getElementById("status");

let stream;

document.getElementById("startBtn").onclick=async()=>{

try{

stream=await navigator.mediaDevices.getUserMedia({
video:{
facingMode:{ideal:"environment"}
},
audio:false
});

video.srcObject=stream;

await video.play();

document.getElementById("startBtn").style.display="none";
document.getElementById("captureBtn").style.display="block";

}catch(e){

status.innerHTML=e.message;

}

};

document.getElementById("captureBtn").onclick=async()=>{

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

canvas.getContext("2d").drawImage(video,0,0);

const data=canvas.toDataURL("image/jpeg",0.92);

status.innerHTML = "Uploading...";

const response = await fetch(API, {
  method: "POST",
  mode: "cors",
  headers: {
    "Content-Type": "text/plain"
  },
  body: JSON.stringify({
    image: base64
  })
});

const json = await response.json();

status.innerHTML = json.success ? "✓ Saved!" : json.error;
} catch {
  status.innerHTML = text;
}
};

</script>

</body>
</html>
