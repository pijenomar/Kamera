<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wedding Camera</title>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#F7F3EC;
  color:#3D352E;
}

.container{
  max-width:430px;
  margin:auto;
  padding:20px;
}

.header{
  text-align:center;
  margin-bottom:20px;
}

.header h1{
  font-family:Georgia,serif;
  font-size:34px;
  margin:8px 0 4px;
}

.header p{
  color:#7B6E63;
  margin:0;
}

#camera{
  width:100%;
  aspect-ratio:3/4;
  background:#000;
  border-radius:20px;
  object-fit:cover;
}

button{
  width:100%;
  border:none;
  border-radius:999px;
  padding:16px;
  font-size:18px;
  font-weight:600;
  cursor:pointer;
}

#startBtn{
  background:#3D352E;
  color:#fff;
  margin-top:18px;
}

#captureBtn{
  background:#fff;
  color:#3D352E;
  border:2px solid #3D352E;
  margin-top:18px;
  display:none;
}

#status{
  text-align:center;
  margin-top:18px;
  min-height:24px;
  font-weight:600;
}

.footer{
  margin-top:28px;
  text-align:center;
  color:#8A8177;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Hafizan & Nabihah</h1>
    <p>Help us capture our special day ♡</p>
  </div>

  <video id="camera" autoplay playsinline muted></video>
  <canvas id="canvas" style="display:none"></canvas>

  <button id="startBtn">Start Camera</button>
  <button id="captureBtn">📸 Take Photo</button>

  <div id="status"></div>

  <div class="footer">
    No app required • Photos upload automatically
  </div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbw3_yije37yBkn7GvgFJE8wEK9luOKedVJP8TlOTGU2x5cXQZthfEsPEdh8XwDcc6kDfA/exec";

const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const status = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const captureBtn = document.getElementById("captureBtn");

let stream = null;

// Start camera only after user taps (required by iPhone Safari)
startBtn.addEventListener("click", async () => {

  status.textContent = "";

  try{

    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ ideal:"environment" },
        width:{ ideal:1920 },
        height:{ ideal:1080 }
      },
      audio:false
    });

    video.srcObject = stream;
    await video.play();

    startBtn.style.display="none";
    captureBtn.style.display="block";

  }catch(err){

    status.textContent = "Camera unavailable";
    console.error(err);

  }

});

// Take photo
captureBtn.addEventListener("click", async () => {

  try{

    captureBtn.disabled=true;
    status.textContent="Uploading...";

    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;

    const ctx=canvas.getContext("2d");
    ctx.drawImage(video,0,0);

    const dataURL=canvas.toDataURL("image/jpeg",0.92);

    const base64=dataURL.split(",")[1];

    const response = await fetch(API,{
      method:"POST",
      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },
      body:JSON.stringify({
        image:base64
      })
    });

    const text=await response.text();
    console.log(text);

    const json=JSON.parse(text);

    if(json.success){

      status.textContent="✓ Photo saved!";
      captureBtn.disabled=false;

    }else{

      status.textContent="Upload failed";
      captureBtn.disabled=false;
      console.log(json);

    }

  }catch(err){

    status.textContent="Connection failed";
    captureBtn.disabled=false;
    console.error(err);

  }

});
</script>

</body>
</html>
